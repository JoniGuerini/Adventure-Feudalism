<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adventure Feudalism</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--BODY-->
<span class="fps" id="fps" aria-hidden="true"></span>
<header class="hud fr fr-wood">
  <div class="brand">
    <h1>Adventure Feudalism</h1>
    <span class="crowns" id="crowns" title="Coroas: vêm dos marcos dos geradores e dos baús"></span>
    <span class="crowns servos" id="servos" title="Servos: todo gerador comprado custa servos"></span>
  </div>
  <nav class="line-tabs" id="line-tabs" role="tablist" aria-label="Linhas de produção"></nav>
</header>

<section class="scene" id="scene-box" aria-label="Cena da linha">
  <canvas id="scene"></canvas>
</section>

<main class="board">
  <div class="board-head">
    <h2><span class="head-line">Linha de produção <span id="line-name"></span></span><span class="head-mis">Missões do reino</span></h2>
    <div class="views" role="tablist" aria-label="O que mostrar da linha">
      <button type="button" class="btn mode view" role="tab" data-view="gens">Geradores</button>
      <button type="button" class="btn mode view" role="tab" data-view="cards">Cartas <span class="upg-badge" id="card-badge"></span></button>
      <button type="button" class="btn mode view" role="tab" data-view="missions">Missões <span class="upg-badge" id="mis-badge"></span></button>
    </div>
    <div class="modes" role="group" aria-label="Quantidade por compra">
      <span>Comprar</span>
      <button type="button" class="btn mode" id="mode-1" data-mode="1">×1</button>
      <button type="button" class="btn mode" id="mode-10" data-mode="10">×10</button>
      <button type="button" class="btn mode" id="mode-max" data-mode="max">Máx</button>
    </div>
  </div>
  <div id="gens"></div>
</main>

<footer class="foot">
  <span>O progresso fica salvo neste navegador. Teclas 1 a 5 trocam de linha. Missões dão baús com cartas.</span>
  <div class="foot-btns">
    <button type="button" class="btn reset" id="mute">Som ligado</button>
    <button type="button" class="btn reset" id="reset">Recomeçar</button>
  </div>
</footer>
<div class="toast fr fr-wood" id="toast" role="status" hidden></div>
<!--/BODY-->
<script src="pixel.js"></script>
<script src="art.js"></script>
<script src="scene.js"></script>
<script src="art-comida.js"></script>
<script src="art-comida-t3.js"></script>
<script src="art-comida-t6.js"></script>
<script src="art-comida-t9.js"></script>
<script src="art-comida-t12.js"></script>
<script src="art-militar.js"></script>
<script src="art-militar-t3.js"></script>
<script src="art-militar-t7.js"></script>
<script src="art-militar-t11.js"></script>
<script src="art-alquimia.js"></script>
<script src="art-alquimia-t3.js"></script>
<script src="art-alquimia-t7.js"></script>
<script src="art-alquimia-t11.js"></script>
<script src="art-minerios.js"></script>
<script src="art-minerios-t3.js"></script>
<script src="art-minerios-t7.js"></script>
<script src="art-minerios-t11.js"></script>
<script src="art-exploracao.js"></script>
<script src="art-exploracao-t3.js"></script>
<script src="art-exploracao-t7.js"></script>
<script src="art-exploracao-t11.js"></script>
<script src="art-meta.js"></script>
<script src="sfx.js"></script>
<script src="ui-scroll.js"></script>
<script src="big.js"></script>
<script src="game.js"></script>
<script src="meta.js"></script>
<script src="meta-ui.js"></script>
</body>
</html>
