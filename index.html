<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adventure Feudalism</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--BODY-->
<span class="fps" id="fps" aria-hidden="true"></span>
<header class="hud fr fr-wood">
  <div class="hud-stats">
    <span class="hud-stat crowns renome fr fr-slot" id="renome"></span>
    <section class="rank-track fr fr-slot" id="rank-track" aria-label="Missões do Renome"></section>
    <span class="hud-stat crowns fr fr-slot" id="crowns"></span>
    <span class="hud-stat crowns servos fr fr-slot" id="servos"></span>
  </div>
  <div class="hud-missions" id="hud-missions" role="list" aria-label="Missões da vez"></div>
</header>

<section class="scene" id="scene-box" aria-label="Cena da linha">
  <canvas id="scene"></canvas>
</section>

<main class="board">
  <!-- abas das linhas e, à direita, quanto comprar por clique -->
  <div class="board-bar">
    <nav class="line-tabs" id="line-tabs" role="tablist" aria-label="Linhas de produção"></nav>
    <div class="modes" role="group" aria-label="Quantidade por compra">
      <button type="button" class="btn mode" id="mode-1" data-mode="1">×1</button>
      <button type="button" class="btn mode" id="mode-10" data-mode="10">×10</button>
      <button type="button" class="btn mode" id="mode-max" data-mode="max">Máx</button>
    </div>
  </div>
  <!-- só esta parte rola (no computador); o resto da tela fica parado -->
  <div class="board-scroll" id="board-scroll">
    <div id="gens"></div>
    <section class="settings" id="settings" hidden>
      <div class="cfg-row fr fr-wood">
        <div class="cfg-txt"><h3 class="cfg-title">Som</h3><span class="cfg-info">Efeitos dos botões, das compras e dos baús.</span></div>
        <button type="button" class="btn cfg-btn" id="mute">Som ligado</button>
      </div>
      <div class="cfg-row fr fr-wood">
        <div class="cfg-txt"><h3 class="cfg-title">Recomeçar</h3><span class="cfg-info">Apaga o progresso deste navegador e começa do zero.</span></div>
        <button type="button" class="btn cfg-btn reset" id="reset">Recomeçar</button>
      </div>
    </section>
  </div>
</main>

<nav class="menu fr fr-wood" id="menu" role="tablist" aria-label="Menus">
  <button type="button" class="btn menu-btn" role="tab" data-view="gens" data-icon="sack"><span class="menu-label">Geradores</span><span class="menu-short">Linha</span></button>
  <button type="button" class="btn menu-btn" role="tab" data-view="servos" data-icon="servo"><span class="menu-label">Recrutamento</span><span class="menu-short">Servos</span> <span class="upg-badge" id="srv-badge"></span></button>
  <button type="button" class="btn menu-btn" role="tab" data-view="cards" data-icon="card"><span class="menu-label">Cartas</span><span class="menu-short">Cartas</span> <span class="upg-badge" id="card-badge"></span></button>
  <button type="button" class="btn menu-btn" role="tab" data-view="missions" data-icon="banner"><span class="menu-label">Missões</span><span class="menu-short">Missões</span> <span class="upg-badge" id="mis-badge"></span></button>
  <button type="button" class="btn menu-btn" role="tab" data-view="config" data-icon="gear"><span class="menu-label">Configurações</span><span class="menu-short">Opções</span></button>
</nav>
<div class="toast fr fr-wood" id="toast" role="status" hidden></div>
<!--/BODY-->
<script src="pixel.js"></script>
<script src="art.js"></script>
<script src="scene.js"></script>
<script src="art-comida.js"></script>
<script src="art-comida-t3.js"></script>
<script src="art-comida-t6.js"></script>
<script src="art-comida-t9.js"></script>
<script src="art-comida-t12.js"></script>
<script src="art-militar.js"></script>
<script src="art-militar-t3.js"></script>
<script src="art-militar-t7.js"></script>
<script src="art-militar-t11.js"></script>
<script src="art-alquimia.js"></script>
<script src="art-alquimia-t3.js"></script>
<script src="art-alquimia-t7.js"></script>
<script src="art-alquimia-t11.js"></script>
<script src="art-minerios.js"></script>
<script src="art-minerios-t3.js"></script>
<script src="art-minerios-t7.js"></script>
<script src="art-minerios-t11.js"></script>
<script src="art-exploracao.js"></script>
<script src="art-exploracao-t3.js"></script>
<script src="art-exploracao-t7.js"></script>
<script src="art-exploracao-t11.js"></script>
<script src="art-meta.js"></script>
<script src="art-cards-comida.js"></script>
<script src="art-cards-militar.js"></script>
<script src="art-cards-alquimia.js"></script>
<script src="art-cards-minerios.js"></script>
<script src="art-cards-exploracao.js"></script>
<script src="art-cards-reino.js"></script>
<script src="art-avatar.js"></script>
<script src="sfx.js"></script>
<script src="ui-scroll.js"></script>
<script src="big.js"></script>
<script src="game.js"></script>
<script src="meta.js"></script>
<script src="meta-ui.js"></script>
</body>
</html>
